spring.application.name=prg04sgtm-backend

# Suporte opcional a arquivo .env
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:prg04sgtm-backend/.env[.properties]

# Configuracoes de conexao com o banco de dados PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracoes JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
